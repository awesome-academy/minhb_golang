{{define "userbar"}}{{template "admin-nav" .}}{{end}}

{{define "content"}}
<div class="form-card mx-auto">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb small mb-2">
      <li class="breadcrumb-item"><a class="text-decoration-none" href="/admin/theaters">Theaters</a></li>
      <li class="breadcrumb-item"><a class="text-decoration-none" href="/admin/theaters/{{.TheaterID}}/rooms">{{.TheaterName}}</a></li>
      <li class="breadcrumb-item active" aria-current="page">{{.Title}}</li>
    </ol>
  </nav>
  <div class="d-flex align-items-center justify-content-between mb-3">
    <h1 class="h4 mb-0">{{.Title}}</h1>
    <a class="text-decoration-none small" href="/admin/theaters/{{.TheaterID}}/rooms">Back to rooms</a>
  </div>
  {{with .Error}}<div class="alert alert-danger py-2">{{.}}</div>{{end}}
  <form method="post" action="{{.Action}}" novalidate class="card card-body">
    <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
    {{if .IsEdit}}<input type="hidden" name="updated_at" value="{{.Form.UpdatedAt}}">{{end}}

    <div class="mb-3">
      <label for="name" class="form-label">Name *</label>
      <input class="form-control{{if index .Errors "name"}} is-invalid{{end}}" id="name" name="name" value="{{.Form.Name}}" required>
      {{with index .Errors "name"}}<div class="invalid-feedback">{{.}}</div>{{end}}
    </div>

    <div class="form-check mb-4">
      <input class="form-check-input" type="checkbox" id="is_active" name="is_active" value="true" {{if .Form.IsActive}}checked{{end}}>
      <label class="form-check-label" for="is_active">Active</label>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-dark">{{.Submit}}</button>
      <a class="btn btn-outline-secondary" href="/admin/theaters/{{.TheaterID}}/rooms">Cancel</a>
    </div>
  </form>
</div>
{{end}}
