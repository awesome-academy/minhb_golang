{{define "content"}}
<div class="login-card card">
  <div class="card-body p-4">
    <h1 class="h4 mb-1">Admin sign in</h1>
    <p class="text-secondary small mb-4">For cinema staff only</p>

    {{with .Error}}
    <div class="alert alert-danger py-2" role="alert">{{.}}</div>
    {{end}}

    <form method="post" action="/admin/login" novalidate>
      <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" value="{{.Email}}" autocomplete="username" required autofocus>
      </div>
      <div class="mb-4">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-dark w-100">Sign in</button>
    </form>
  </div>
</div>
{{end}}
